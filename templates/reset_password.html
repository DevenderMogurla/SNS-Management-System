
{% extends "base.html" %}

{% block title %}
SNS - Reset Password
{% endblock %}

{% block content %}

<div class="container">

    <h2>Reset Password</h2>

    <p>
        Enter your new password below.
    </p>

    <form
        action="{{ url_for('reset_password', token=token) }}"
        method="POST"
    >

        <label for="password">
            New Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter new password"
            required
        >

        <label for="confirm_password">
            Confirm New Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <p>
        Remember your password?

        <a href="{{ url_for('login') }}">
            Login
        </a>
    </p>

</div>

{% endblock %}
