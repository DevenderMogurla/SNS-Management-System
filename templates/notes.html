<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Notes</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        nav {
            background: #222;
            padding: 15px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button,
        .btn {
            padding: 10px 15px;
            border: none;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .clear {
            background: #777;
        }

        .note {
            background: white;
            padding: 20px;
            margin-top: 15px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .note-buttons {
            margin-top: 15px;
        }

    </style>

</head>


<body>


<nav>

    <a href="{{ url_for('home') }}">
        Home
    </a>

    <a href="{{ url_for('dashboard') }}">
        Dashboard
    </a>

    <a href="{{ url_for('mynotes') }}">
        Notes
    </a>

    <a href="{{ url_for('files') }}">
        Files
    </a>

    <a href="{{ url_for('logout') }}">
        Logout
    </a>

</nav>


<div class="container">

    <h1>
        My Notes
    </h1>


    <!-- SEARCH -->

    <form
        method="GET"
        action="{{ url_for('mynotes') }}"
        class="search-box"
    >

        <input
            type="text"
            name="search"
            value="{{ search }}"
            placeholder="Search notes by title or content"
        >

        <button type="submit">
            Search
        </button>

        {% if search %}

            <a
                href="{{ url_for('mynotes') }}"
                class="btn clear"
            >
                Clear
            </a>

        {% endif %}

    </form>


    <!-- ADD NOTE -->

    <a
        href="{{ url_for('addnote') }}"
        class="btn"
    >
        + Add Note
    </a>


    <br><br>


    <!-- NOTES -->

    {% if notes %}

        {% for note in notes %}

            <div class="note">

                <h2>
                    {{ note.title }}
                </h2>

                <p>
                    {{ note.content }}
                </p>


                <div class="note-buttons">

                    <a
                        class="btn"
                        href="{{ url_for(
                            'viewnote',
                            note_id=note.notesid
                        ) }}"
                    >
                        View
                    </a>


                    <a
                        class="btn"
                        href="{{ url_for(
                            'editnote',
                            note_id=note.notesid
                        ) }}"
                    >
                        Edit
                    </a>


                    <a
                        class="btn"
                        href="{{ url_for(
                            'deletenote',
                            note_id=note.notesid
                        ) }}"
                    >
                        Delete
                    </a>

                </div>

            </div>

        {% endfor %}

    {% else %}

        <p>
            No notes found.
        </p>

    {% endif %}


</div>

</body>

</html>
