<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Files</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        nav {
            background: #222;
            padding: 15px 30px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button,
        .btn {
            padding: 10px 15px;
            border: none;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .clear {
            background: #777;
        }

        .upload {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .file {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .file-buttons {
            margin-top: 15px;
        }

    </style>

</head>


<body>


<nav>

    <a href="{{ url_for('home') }}">
        Home
    </a>

    <a href="{{ url_for('dashboard') }}">
        Dashboard
    </a>

    <a href="{{ url_for('mynotes') }}">
        Notes
    </a>

    <a href="{{ url_for('files') }}">
        Files
    </a>

    <a href="{{ url_for('logout') }}">
        Logout
    </a>

</nav>


<div class="container">

    <h1>
        My Files
    </h1>


    <!-- SEARCH FILES -->

    <form
        method="GET"
        action="{{ url_for('files') }}"
        class="search-box"
    >

        <input
            type="text"
            name="search"
            value="{{ search }}"
            placeholder="Search files by name"
        >

        <button type="submit">
            Search
        </button>

        {% if search %}

            <a
                href="{{ url_for('files') }}"
                class="btn clear"
            >
                Clear
            </a>

        {% endif %}

    </form>


    <!-- UPLOAD FILE -->

    <div class="upload">

        <h2>
            Upload File
        </h2>

        <form
            method="POST"
            action="{{ url_for('files') }}"
            enctype="multipart/form-data"
        >

            <input
                type="file"
                name="file"
                required
            >

            <button type="submit">
                Upload
            </button>

        </form>

    </div>


    <!-- FILE LIST -->

    {% if files %}

        {% for file in files %}

            <div class="file">

                <h2>
                    {{ file.originalname }}
                </h2>

                <p>
                    Type:
                    {{ file.mimetype }}
                </p>

                <p>
                    Size:
                    {{ file.size }} bytes
                </p>


                <div class="file-buttons">


                    <!-- DOWNLOAD -->

                    <a
                        class="btn"
                        href="{{ url_for(
                            'download_file',
                            file_id=file.fileid
                        ) }}"
                    >
                        Download
                    </a>


                    <!-- EDIT -->

                    <a
                        class="btn"
                        href="{{ url_for(
                            'editfile',
                            file_id=file.fileid
                        ) }}"
                    >
                        Edit
                    </a>


                    <!-- DELETE -->

                    <a
                        class="btn"
                        href="{{ url_for(
                            'delete_file',
                            file_id=file.fileid
                        ) }}"
                    >
                        Delete
                    </a>


                </div>

            </div>

        {% endfor %}

    {% else %}

        <p>
            No files found.
        </p>

    {% endif %}


</div>

</body>

</html>
