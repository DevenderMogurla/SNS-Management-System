<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
    {% block title %}
    SNS Management
    {% endblock %}
</title>

<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        color: #1e293b;
        display: flex;
        flex-direction: column;
    }

    /* ================= NAVBAR ================= */

    nav {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        padding: 18px 8%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    }

    .logo {
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
        letter-spacing: 1px;
    }

    .nav-links {
        display: flex;
        gap: 10px;
    }

    .nav-links a {
        color: white;
        text-decoration: none;
        padding: 9px 16px;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
    }

    .nav-links a:hover {
        background-color: rgba(255, 255, 255, 0.18);
        transform: translateY(-1px);
    }

    /* ================= MAIN CONTENT ================= */

    main {
        flex: 1;
        padding: 30px 20px;
    }

    .container {
        width: 90%;
        max-width: 520px;
        margin: 35px auto;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
    }

    /* ================= HEADINGS ================= */

    h1 {
        color: #312e81;
        margin-bottom: 15px;
        font-size: 32px;
    }

    h2 {
        color: #312e81;
        margin-bottom: 12px;
        font-size: 28px;
    }

    p {
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 15px;
    }

    /* ================= FORM ================= */

    form {
        margin-top: 25px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        color: #334155;
    }

    input {
        width: 100%;
        padding: 13px 14px;
        margin-bottom: 18px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 15px;
        outline: none;
        transition: 0.3s;
        background-color: #f8fafc;
    }

    input:focus {
        border-color: #6366f1;
        background-color: white;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    /* ================= BUTTON ================= */

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 9px;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.30);
    }

    /* ================= LINKS ================= */

    a {
        color: #4f46e5;
        font-weight: 600;
    }

    a:hover {
        color: #7c3aed;
    }

    /* ================= FLASH MESSAGES ================= */

    .flash-container {
        width: 90%;
        max-width: 520px;
        margin: 20px auto 0;
    }

    .success,
    .msg {
        background-color: #dcfce7;
        color: #166534;
        border: 1px solid #86efac;
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 10px;
    }

    .error,
    .err {
        background-color: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 10px;
    }

    /* ================= FOOTER ================= */

    footer {
        text-align: center;
        padding: 22px;
        background-color: #0f172a;
        color: #cbd5e1;
        margin-top: auto;
        font-size: 14px;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 600px) {

        nav {
            padding: 15px 5%;
            flex-direction: column;
            gap: 12px;
        }

        .nav-links {
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .container {
            width: 95%;
            padding: 25px 20px;
            margin: 20px auto;
        }

        h1 {
            font-size: 26px;
        }

        h2 {
            font-size: 24px;
        }

    }

</style>


</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <a href="/" class="logo">
        SNS
    </a>

    <div class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="/register">
            Register
        </a>

        <a href="/login">
            Login
        </a>

    </div>

</nav>


<!-- ================= FLASH MESSAGES ================= -->

{% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        <div class="flash-container">

            {% for category, message in messages %}

                <p class="{{ category }}">
                    {{ message }}
                </p>

            {% endfor %}

        </div>

    {% endif %}

{% endwith %}


<!-- ================= MAIN CONTENT ================= -->

<main>

    {% block content %}

    {% endblock %}

</main>


<!-- ================= FOOTER ================= -->

<footer>

    SNS Management &nbsp; | &nbsp; Codegnan

</footer>


</body>

</html>
