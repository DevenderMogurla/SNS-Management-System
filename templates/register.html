{% extends "base.html" %}


{% block title %}

SNS - Register

{% endblock %}


{% block content %}

<div class="container">

    <h2>Create Account</h2>

    <p>
        Create an account to manage your notes and files.
    </p>


    <form action="/register" method="POST">

        <label for="name">
            Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >


        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <label for="confirm_password">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm password"
            required
        >


        <button type="submit">
            Register
        </button>

    </form>


    <p>
        Already have an account?

        <a href="/login">
            Login
        </a>
    </p>

</div>

{% endblock %}
