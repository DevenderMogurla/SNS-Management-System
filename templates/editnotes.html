<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Note</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        textarea {
            min-height: 300px;
            resize: vertical;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        .back {
            margin-left: 10px;
            text-decoration: none;
            color: #555;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Edit Note</h1>

    <form method="POST">

        <label>Title</label>

        <input
            type="text"
            name="title"
            value="{{ note.title }}"
            required
        >

        <label>Content</label>

        <textarea
            name="content"
            required
        >{{ note.content }}</textarea>

        <button type="submit">
            Update Note
        </button>

        <a
            href="{{ url_for('viewnote', note_id=note.notesid) }}"
            class="back"
        >
            Cancel
        </a>

    </form>

</div>

</body>
</html>
